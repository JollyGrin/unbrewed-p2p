# Sample workflow for building and deploying a Next.js site to GitHub Pages
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: Deploy Next.js site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # PRs run the build only (install, next build with its lint, export). The
  # PostHog source-map upload, the Pages artifact and the deploy job are all
  # skipped on pull_request, so a PR can never publish anything.
  pull_request:

# GITHUB_TOKEN permissions are granted per job, not workflow-wide: the build
# job also runs PR code (pull_request trigger), so only `deploy`, which never
# runs on a PR, gets the Pages write + OIDC token permissions.
permissions: {}

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# PR builds get their own per-PR group (newer pushes cancel older builds) so
# they never queue behind or in front of a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-build-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions/configure-pages reads the Pages site config.
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # bun is the package manager only (issue #1584): it installs
      # node_modules from bun.lock. Node 20 still runs next build, the
      # postbuild script and next export.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Reads the "packageManager": "bun@x.y.z" pin in package.json.
          bun-version-file: package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Automatically inject basePath in your Next.js configuration file and disable
          # server side image optimization (https://nextjs.org/docs/api-reference/next/image#unoptimized).
          #
          # You may remove this line if you want to manage the configuration yourself.
          static_site_generator: next
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-
      - name: Restore bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check bun.lock keeps libc on native binaries
        # Issue #1585: bun < 1.4.4 silently strips "libc" from these entries
        # on `bun add` / a non-frozen install, which brings back ~124 MB of
        # musl duplicates on glibc hosts. --frozen-lockfile can't catch that.
        run: |
          missing=$(grep -E '^\s*"(@next/swc-linux|@img/sharp-(libvips-)?linux)[^"]*": \[' bun.lock | grep -v '"libc"' || true)
          if [ -n "$missing" ]; then
            echo "::error file=bun.lock::bun.lock entries for linux @next/swc / @img/sharp binaries are missing \"libc\". Regenerate bun.lock with bun >= 1.4.4 (the packageManager pin in package.json); older bun drops the field."
            echo "$missing" | cut -c1-120
            exit 1
          fi
          echo "libc present on $(grep -cE '^\s*"(@next/swc-linux|@img/sharp-(libvips-)?linux)[^"]*": \[' bun.lock) linux native-binary entries"
      - name: Build with Next.js
        # NEXT_PUBLIC_PRO_WS_URL is baked in at build time. When the repo
        # variable is unset it expands to "" and /pro/game falls back to its
        # hardcoded engine default (wss://engine.unbrewed.xyz),
        # so the deployed page is playable with zero config. To point Pages at a
        # different backend, set a repository variable of that name to the new
        # wss:// URL (Settings → Secrets and variables → Actions → Variables).
        #
        # NEXT_PUBLIC_API_URL (accounts API, issue #459) works the same way and
        # falls back to https://api.unbrewed.xyz. The account chip hides itself
        # whenever that host doesn't answer, so an unset/undeployed API leaves
        # the site exactly as it is today.
        #
        # NEXT_PUBLIC_JEVX3_ALLOWLIST (issue #933): comma-separated account ids
        # and/or usernames (usernames case-insensitive) that may pick the gated
        # jevx3 bot tier without 15 wins vs Expert. Unset/empty = nobody, the
        # default. It is baked into the PUBLIC bundle — ids/usernames only,
        # never secrets. Read once, in lib/pro/tierUnlock.ts.
        #
        # NEXT_PUBLIC_CHANGELOG_MEDIA_URL (issue #1070): optional override
        # of the changelog media CDN base. Unset/empty (the variable is passed
        # through as an empty string) falls back to the default,
        # https://cdn.unbrewed.xyz. See lib/changelog/media.ts.
        #
        # NEXT_PUBLIC_POSTHOG_KEY / NEXT_PUBLIC_POSTHOG_HOST (issue #1438):
        # product analytics. The key is PostHog's public project key, baked
        # into the bundle — never a secret. The host is the first-party proxy
        # (https://t.unbrewed.xyz). Unset/empty key = analytics fully off.
        # See docs/analytics.md.
        env:
          NEXT_PUBLIC_PRO_WS_URL: ${{ vars.NEXT_PUBLIC_PRO_WS_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_JEVX3_ALLOWLIST: ${{ vars.NEXT_PUBLIC_JEVX3_ALLOWLIST }}
          NEXT_PUBLIC_CHANGELOG_MEDIA_URL: ${{ vars.NEXT_PUBLIC_CHANGELOG_MEDIA_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          # Short commit hash surfaced in in-game bug reports (issue #87).
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
        run: npx --no-install next build
      - name: Run postbuild
        run: node lib/buildTools/prefixFonts.js
      - name: Static HTML export with Next.js
        run: npx --no-install next export
      # Source maps for PostHog Error Tracking (issue #1548). next.config.js
      # sets productionBrowserSourceMaps, so ./out/_next/static has a .map per
      # chunk. `inject` stamps each chunk with the chunk id PostHog matches
      # $exception frames on (and registers the release), `upload` sends the
      # maps. Release = unbrewed-p2p @ github.sha, the same commit the client
      # reports as app_commit (app_version is package.json's version).
      #
      # Needs the POSTHOG_CLI_TOKEN secret (a PostHog personal API key with
      # error tracking write) and the POSTHOG_CLI_ENV_ID variable (306568).
      # Without the token (forks, or before it is added) the step warns and
      # skips. An upload failure warns too, rather than blocking the deploy.
      - name: Upload source maps to PostHog
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_TOKEN }}
          POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_ENV_ID || '306568' }}
          POSTHOG_CLI_HOST: https://eu.posthog.com
        run: |
          if [ -z "$POSTHOG_CLI_API_KEY" ]; then
            echo "::warning title=Source maps not uploaded::POSTHOG_CLI_TOKEN secret is not set; PostHog stack traces for this deploy stay minified."
            exit 0
          fi
          cli="npx --yes @posthog/cli@0.19.0"
          release="--release-name unbrewed-p2p --release-version ${{ github.sha }}"
          if ! $cli sourcemap inject --directory ./out/_next/static $release \
            || ! $cli sourcemap upload --directory ./out/_next/static $release; then
            echo "::warning title=Source map upload failed::posthog-cli failed; PostHog stack traces for this deploy stay minified."
            exit 1
          fi
      # Never publish source: drop every .map and the comments pointing at
      # them, whether or not the upload ran, then make sure none are left.
      - name: Remove source maps from the Pages artifact
        run: |
          find ./out -name '*.map' -type f -delete
          find ./out/_next/static -type f \( -name '*.js' -o -name '*.css' \) \
            -exec sed -i -E '/^\/[/*]# sourceMappingURL=/d' {} +
          left=$(find ./out -name '*.map' -type f | wc -l)
          if [ "$left" -ne 0 ]; then
            echo "::error::$left .map files still in ./out"
            exit 1
          fi
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    # Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
